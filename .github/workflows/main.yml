name: CI and Docker delivery

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  integration:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compile Python sources
        run: python -m compileall -q app.py main.py networksecurity

  build-and-push-ecr-image:
    name: Build and push Docker image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  container-smoke-test:
    name: Container smoke test
    needs: build-and-push-ecr-image
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull and start the container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          set -e
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker pull "$IMAGE"

          # A local placeholder URI is sufficient for startup validation.
          # The /docs route does not need a live MongoDB query.
          docker run -d \
            --name networksecurity-smoke-test \
            -p 8000:8000 \
            -e MONGODB_URL_KEY="mongodb://127.0.0.1:27017" \
            "$IMAGE"

          cleanup() {
            docker logs networksecurity-smoke-test || true
            docker rm -f networksecurity-smoke-test || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/docs > /dev/null; then
              echo "FastAPI documentation endpoint responded successfully."
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' networksecurity-smoke-test 2>/dev/null || true)" != "true" ]; then
              echo "Container exited before the API became ready."
              exit 1
            fi

            sleep 2
          done

          echo "API did not become ready within 60 seconds."
          exit 1
